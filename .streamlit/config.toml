[server]
headless = true
enableCORS = false
enableXsrfProtection = false
# Streamlit Community Cloud does not need hot-reload file watching in production.
# Disable watchdog/inotify so the app does not exhaust the container's inotify
# instance quota and repeatedly log "inotify instance limit reached".
fileWatcherType = "none"

[theme]
primaryColor = "#5275A8"
backgroundColor = "#0B0D10"
secondaryBackgroundColor = "#15171B"
textColor = "#F8FAFC"
font = "sans serif"

[browser]
gatherUsageStats = false
